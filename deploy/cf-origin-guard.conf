# 备用方案（已改走 mTLS，见 deploy/README-hardening.md）：
# 源站守卫：只允许 Cloudflare 边缘节点回源（其它来源一律 403）
# 放到 /etc/nginx/conf.d/01-cf-origin-guard.conf（http 上下文生效），
# 然后在 443 server 块里加：
#     if ($cf_origin_ok = 0) { return 403; }
#
# 注意：nginx 的 realip 模块会把 $remote_addr 改写成 CF-Connecting-IP（真实客户端），
# 所以必须判断 $realip_remote_addr（改写前的 TCP 对端地址），否则会把所有 CF 回源都拒掉。
# Cloudflare 新增网段时要同步更新本文件与 ufw-cf.sh，否则站点会不可用。

geo $realip_remote_addr $cf_origin_ok {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
